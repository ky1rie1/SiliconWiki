<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <title>SiliconWiki Iconic Chip Mark</title>
  <desc>Signature Silicon Gold and Obsidian Chip Mark for SiliconWiki</desc>
  <defs>
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Machined Substrate / IHS Package (Obsidian Black with subtle gold hairline) -->
  <rect x="36" y="36" width="440" height="440" rx="44" fill="#000000" stroke="#F7D84A" stroke-width="2.5" stroke-opacity="0.25" />

  <!-- Inner Gold Squircle Circuit Ring -->
  <rect x="72" y="72" width="368" height="368" rx="100" fill="none" stroke="#F7D84A" stroke-width="14" stroke-linejoin="round" />

  <!-- Monolithic Center Silicon Core / Die -->
  <rect x="168" y="168" width="176" height="176" rx="18" fill="#F7D84A" />
</svg>
