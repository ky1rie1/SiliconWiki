<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>SiliconWiki Icon</title>
  <desc>SiliconWiki signature gold chip tile</desc>
  <!-- Background Tile: Silicon Gold -->
  <rect width="512" height="512" rx="112" fill="#F7D84A" />
  
  <!-- Monolithic Chip Package: Obsidian Dark -->
  <rect x="92" y="92" width="328" height="328" rx="36" fill="#09090b" />
  
  <!-- Circuit Trace Ring: Silicon Gold -->
  <rect x="120" y="120" width="272" height="272" rx="76" fill="none" stroke="#F7D84A" stroke-width="11" />
  
  <!-- Central Silicon Core Die -->
  <rect x="190" y="190" width="132" height="132" rx="14" fill="#F7D84A" />
</svg>
